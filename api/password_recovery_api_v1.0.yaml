openapi: 3.1.0
info:
  title: Grammar Mastery Password Recovery Extension
  version: 1.0.0
  description: >-
    Additive public account-recovery contract. This extension intentionally does
    not rewrite the frozen Stage 21 core operation map.
servers:
  - url: /api/v1
paths:
  /auth/password-reset/request:
    post:
      summary: Request a generic single-use password recovery link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 320}
                locale: {type: string, enum: [fa-IR, en-CA], default: fa-IR}
      responses:
        '202':
          description: Generic acceptance; does not disclose whether the account exists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryEnvelope'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/password-reset/confirm:
    post:
      summary: Consume one reset token and replace the password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token: {type: string, minLength: 32, maxLength: 256, writeOnly: true}
                new_password: {type: string, minLength: 12, maxLength: 256, writeOnly: true}
      responses:
        '200':
          description: Password changed and prior sessions revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: Standard Grammar Mastery error envelope
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, fields, request_id]
                properties:
                  code: {type: string}
                  message: {type: string}
                  fields: {type: object}
                  request_id: {type: string}
  schemas:
    RecoveryEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: {type: string, enum: [ACCEPTED, PASSWORD_RESET]}
        meta:
          type: object
          additionalProperties: false
          required: [request_id, api_version]
          properties:
            request_id: {type: string}
            api_version: {const: v1}
