          application/json:
            schema:
              $ref: '#/components/schemas/CommitPreviewRequest'
      responses:
        '200':
          description: Safe transitions committed atomically and audited
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
