openapi: 3.1.0
info:
  title: Grammar Mastery Core API
  version: 1.0.0
  description: >-
    Stage 21 Django REST Framework implementation contract. Owner: Iman.
    Prepared 2026-08-09 UTC. Next.js 16 Active LTS is the selected Stage 22
    consumer. Learning and authorization rules remain backend-owned.
    Learner question projections never expose an answer key before submission.
  x-contract-version: grammar-mastery-api-v1.0.0
  x-status: DJANGO_DRF_IMPLEMENTATION_PROFILE_VALIDATED_PENDING_OWNER_ACCEPTANCE
  x-implementation-profile:
    version: stage21-django-nextjs-profile-v1.0.0
    backend: Django 5.2 LTS
    api_adapter: Django REST Framework 3.16+
    serving_interface: ASGI
    frontend_consumer: Next.js 16 Active LTS
    frontend_implementation_stage: 22
    contract_mode: contract-first
servers:
  - url: /api/v1
    description: Deployment-relative Django REST API, preferably same-origin behind Next.js
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Content
  - name: Tests
  - name: Attempts
  - name: Review
  - name: Mastery
  - name: Analytics
  - name: Admin
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a learner account
      security: []
      x-service: AUTH
      x-roles: [PUBLIC]
      x-rate-limit-policy: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Learner registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Create a revocable login session
      security: []
      x-service: AUTH
      x-roles: [PUBLIC]
      x-rate-limit-policy: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Revoke the current session
      x-service: AUTH
      x-roles: [USER, ADMIN, CONTENT_EDITOR, REVIEWER]
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /lessons:
    get:
      tags: [Content]
      operationId: listLessons
      summary: List active lessons
      x-service: CONTENT
      x-roles: [USER]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/Sort'
        - name: filter[category_id]
          in: query
          schema: {type: string, format: uuid}
        - name: filter[tag_id]
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Lesson page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonCollectionEnvelope'
        '400': {$ref: '#/components/responses/BadQuery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /lessons/{lessonId}:
    parameters:
      - $ref: '#/components/parameters/LessonId'
    get:
      tags: [Content]
      operationId: getLesson
      summary: Get a lesson and active subtopics
      x-service: CONTENT
      x-roles: [USER]
      responses:
        '200':
          description: Lesson detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonDetailEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tests:
    post:
      tags: [Tests]
      operationId: createTest
      summary: Create a test from a versioned configuration
      description: Fails safely when no eligible PUBLISHED inventory exists.
      x-service: TEST_ORCHESTRATION
      x-roles: [USER]
      x-owner-scope: SELF
      x-idempotency: REQUIRED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCreateRequest'
      responses:
        '201':
          description: Test snapshot created
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /tests/{testId}:
    parameters:
      - $ref: '#/components/parameters/TestId'
    get:
      tags: [Tests]
      operationId: getTest
      summary: Get owner-scoped test metadata
      description: This resource never contains question answer keys.
      x-service: TEST_ORCHESTRATION
      x-roles: [USER]
      x-owner-scope: SELF
      responses:
        '200':
          description: Test metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tests/{testId}/attempts:
    parameters:
      - $ref: '#/components/parameters/TestId'
    post:
      tags: [Attempts]
      operationId: startAttempt
      summary: Start an attempt for a frozen test
      x-service: TEST_ORCHESTRATION
      x-roles: [USER]
      x-owner-scope: SELF
      x-idempotency: REQUIRED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Attempt started
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /attempts/{attemptId}/next:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Attempts]
      operationId: getNextAttemptQuestion
      summary: Get the next unanswered frozen question
      description: Uses the answer-key-free AttemptQuestion schema.
      x-service: ANSWER_PIPELINE
      x-roles: [USER]
      x-owner-scope: SELF
      responses:
        '200':
          description: Next question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptQuestionEnvelope'
        '204': {description: No unanswered question remains}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /attempts/{attemptId}/answers:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [Attempts]
      operationId: submitAttemptAnswer
      summary: Submit one answer transactionally
      description: Commits answer, mastery, Error Review and SRS effects atomically.
      x-service: ANSWER_PIPELINE
      x-roles: [USER]
      x-owner-scope: SELF
      x-idempotency: REQUIRED
      x-rate-limit-policy: answer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: Answer accepted; feedback applies only to this item
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerReceiptEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /attempts/{attemptId}/complete:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [Attempts]
      operationId: completeAttempt
      summary: Complete and score an attempt
      x-service: ANSWER_PIPELINE
      x-roles: [USER]
      x-owner-scope: SELF
      x-idempotency: REQUIRED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Attempt completed
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /attempts/{attemptId}/result:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Attempts]
      operationId: getAttemptResult
      summary: Get a completed attempt result
      x-service: ANSWER_PIPELINE
      x-roles: [USER]
      x-owner-scope: SELF
      responses:
        '200':
          description: Completed result and item feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResultEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /reviews:
    get:
      tags: [Review]
      operationId: listReviews
      summary: List mistake groups and spaced-review concepts
      x-service: ERROR_REVIEW
      x-roles: [USER]
      x-owner-scope: SELF
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/Sort'
        - name: filter[kind]
          in: query
          schema: {type: string, enum: [MISTAKE, SPACED]}
        - name: filter[resolution_status]
          in: query
          schema: {type: string, enum: [UNRESOLVED, CORRECTED, EXCLUDED_CONTENT_ISSUE]}
        - name: filter[marked]
          in: query
          schema: {type: boolean}
        - name: filter[due]
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: Review collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCollectionEnvelope'
        '400': {$ref: '#/components/responses/BadQuery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      tags: [Review]
      operationId: getReviewItem
      summary: Open one frozen review item
      description: Feedback is hidden until retry or an audited explicit reveal.
      x-service: ERROR_REVIEW
      x-roles: [USER]
      x-owner-scope: SELF
      responses:
        '200':
          description: Review item without a premature answer key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItemEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /reviews/{reviewId}/grade:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      tags: [Review]
      operationId: gradeReview
      summary: Submit a retrieval-practice retry
      description: Resolution evidence only; original score/mastery/SRS evidence is unchanged.
      x-service: ERROR_REVIEW
      x-roles: [USER]
      x-owner-scope: SELF
      x-idempotency: REQUIRED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewGradeRequest'
      responses:
        '200':
          description: Retry graded and review state updated
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewFeedbackEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /reviews/{reviewId}/reveal:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    post:
      tags: [Review]
      operationId: revealReviewAnswer
      summary: Explicitly reveal and audit feedback
      description: Reveal alone does not resolve the review item.
      x-service: ERROR_REVIEW
      x-roles: [USER]
      x-owner-scope: SELF
      responses:
        '200':
          description: Feedback revealed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewFeedbackEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /reviews/{reviewId}/mark:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    put:
      tags: [Review]
      operationId: setReviewMark
      summary: Mark or unmark a review item
      x-service: ERROR_REVIEW
      x-roles: [USER]
      x-owner-scope: SELF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewMarkRequest'
      responses:
        '200':
          description: Mark state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItemEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /mastery:
    get:
      tags: [Mastery]
      operationId: getMastery
      summary: Get current mastery with confidence and coverage
      x-service: MASTERY
      x-roles: [USER]
      x-owner-scope: SELF
      parameters:
        - name: filter[scope_type]
          in: query
          schema: {type: string, enum: [SUBTOPIC, LESSON, CATEGORY, TAG]}
        - name: filter[scope_id]
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current mastery resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasteryCollectionEnvelope'
        '400': {$ref: '#/components/responses/BadQuery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /progress:
    get:
      tags: [Mastery]
      operationId: getProgress
      summary: Get persisted mastery snapshots and trend completeness
      x-service: ANALYTICS
      x-roles: [USER]
      x-owner-scope: SELF
      parameters:
        - name: filter[scope_type]
          in: query
          schema: {type: string, enum: [SUBTOPIC, LESSON, CATEGORY, TAG]}
        - name: filter[scope_id]
          in: query
          schema: {type: string, format: uuid}
        - name: filter[from]
          in: query
          schema: {type: string, format: date-time}
        - name: filter[to]
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Persisted progress series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressEnvelope'
        '400': {$ref: '#/components/responses/BadQuery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /dashboard:
    get:
      tags: [Analytics]
      operationId: getDashboard
      summary: Get one aggregated learning-dashboard resource
      x-service: ANALYTICS
      x-roles: [USER]
      x-owner-scope: SELF
      responses:
        '200':
          description: Stage 18 dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /next-actions/current:
    get:
      tags: [Analytics]
      operationId: getCurrentNextAction
      summary: Get the highest-priority safe learner action
      x-service: ANALYTICS
      x-roles: [USER]
      x-owner-scope: SELF
      responses:
        '200':
          description: One action selected by the Stage 18 priority contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextActionEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /analytics/jobs:
    post:
      tags: [Analytics]
      operationId: createAnalyticsJob
      summary: Queue a heavy analytics rebuild or backfill
      x-service: ANALYTICS
      x-roles: [ADMIN]
      x-idempotency: REQUIRED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsJobRequest'
      responses:
        '202':
          description: Job queued
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsJobEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /analytics/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Analytics]
      operationId: getAnalyticsJob
      summary: Get heavy analytics job state
      x-service: ANALYTICS
      x-roles: [ADMIN]
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsJobEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/questions:
    get:
      tags: [Admin]
      operationId: listAdminQuestions
      summary: Search and filter the question bank
      x-service: ADMIN
      x-roles: [ADMIN, CONTENT_EDITOR, REVIEWER]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/Sort'
        - name: filter[lesson_id]
          in: query
          schema: {type: string, format: uuid}
        - name: filter[status]
          in: query
          schema: {$ref: '#/components/schemas/QuestionStatus'}
        - name: filter[difficulty]
          in: query
          schema: {$ref: '#/components/schemas/Difficulty'}
      responses:
        '200':
          description: Staff question-bank page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestionCollectionEnvelope'
        '400': {$ref: '#/components/responses/BadQuery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      operationId: createAdminQuestionDraft
      summary: Create a DRAFT question
      x-service: ADMIN
      x-roles: [ADMIN, CONTENT_EDITOR]
      x-rate-limit-policy: admin_mutation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionDraftRequest'
      responses:
        '201':
          description: Draft created and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestionEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    patch:
      tags: [Admin]
      operationId: createAdminQuestionRevision
      summary: Create an immutable question revision
      x-service: ADMIN
      x-roles: [ADMIN, CONTENT_EDITOR]
      x-rate-limit-policy: admin_mutation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRevisionRequest'
      responses:
        '200':
          description: New revision created and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestionEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/questions/{questionId}/review:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    post:
      tags: [Admin]
      operationId: reviewAdminQuestion
      summary: Approve reject or request changes
      description: Backend enforces reviewer identity different from author or generator.
      x-service: ADMIN
      x-roles: [ADMIN, REVIEWER]
      x-stage11-transition-gate: true
      x-rate-limit-policy: admin_mutation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionReviewRequest'
      responses:
        '200':
          description: Dedicated review action recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestionEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/questions/{questionId}/retire:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    post:
      tags: [Admin]
      operationId: retireAdminQuestion
      summary: Immediately retire unsafe content
      x-service: ADMIN
      x-roles: [ADMIN]
      x-rate-limit-policy: admin_mutation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetirementRequest'
      responses:
        '200':
          description: Question retired; history preserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestionEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/questions/{questionId}/retire-request:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    post:
      tags: [Admin]
      operationId: requestAdminQuestionRetirement
      summary: Request an auditable retirement decision
      x-service: ADMIN
      x-roles: [CONTENT_EDITOR, REVIEWER]
      x-rate-limit-policy: admin_mutation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetirementRequest'
      responses:
        '202':
          description: Retirement request queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/imports/preview:
    post:
      tags: [Admin]
      operationId: previewAdminImport
      summary: Validate a DRAFT-only import without mutation
      x-service: ADMIN
      x-roles: [ADMIN, CONTENT_EDITOR]
      x-import-status: DRAFT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPreviewRequest'
      responses:
        '200':
          description: Preview plus confirmation token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
