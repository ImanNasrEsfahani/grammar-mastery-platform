  /admin/audit-log:
    get:
      tags: [Admin]
      operationId: listAdminAuditEvents
      summary: Read correlated immutable admin audit history
      x-service: ADMIN
      x-roles: [ADMIN, REVIEWER]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/Sort'
        - name: filter[action]
          in: query
          schema: {type: string, maxLength: 60}
        - name: filter[resource_id]
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Correlated Stage 12 and Stage 20 audit records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCollectionEnvelope'
        '400': {$ref: '#/components/responses/BadQuery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session-backed Stage 21 bearer access token
  headers:
    IdempotentReplayed:
      description: True when the stored response was replayed for the same key and request hash
      schema: {type: boolean}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$'}
    PageSize:
      name: page[size]
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    PageAfter:
      name: page[after]
      in: query
      schema: {type: string, minLength: 16, maxLength: 512}
    Sort:
      name: sort
      in: query
      schema: {type: string, maxLength: 120}
    LessonId: {name: lessonId, in: path, required: true, schema: {type: string, format: uuid}}
    TestId: {name: testId, in: path, required: true, schema: {type: string, format: uuid}}
    AttemptId: {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
    ReviewId: {name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    QuestionId: {name: questionId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    BadQuery:
      description: Query parameter invalid
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Unauthorized:
      description: Authentication required or token/session invalid
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Forbidden:
      description: Authenticated principal lacks permission
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotFound:
      description: Resource absent or concealed owner mismatch
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: State or idempotency conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Validation:
      description: Request validation or safe inventory failure
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RateLimited:
      description: Versioned rate limit exceeded
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Unavailable:
      description: Required dependency unavailable
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [request_id, api_version]
      properties:
        request_id: {type: string, minLength: 8, maxLength: 128}
        api_version: {const: v1}
    Page:
      type: object
      additionalProperties: false
      required: [page_size, has_more, next_cursor]
      properties:
        page_size: {type: integer, minimum: 1, maximum: 100}
        has_more: {type: boolean}
        next_cursor: {type: [string, 'null']}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, fields, request_id]
          properties:
            code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,79}$'}
            message: {type: string, minLength: 1, maxLength: 500}
            fields:
              type: object
              additionalProperties:
                type: array
                minItems: 1
                items: {type: string, minLength: 1, maxLength: 300}
            request_id: {type: string, minLength: 8, maxLength: 128}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 12, maxLength: 256, writeOnly: true}
        display_name: {type: [string, 'null'], maxLength: 200}
        locale: {type: string, enum: [fa-IR, en-CA], default: fa-IR}
        timezone: {type: string, minLength: 1, maxLength: 80, default: UTC}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
    User:
      type: object
      additionalProperties: false
      required: [id, email, roles]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: [string, 'null']}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [USER, ADMIN, CONTENT_EDITOR, REVIEWER]}
    AuthToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, session_id]
      properties:
        access_token: {type: string, minLength: 40, readOnly: true}
        token_type: {const: Bearer}
        expires_in: {type: integer, minimum: 60}
        session_id: {type: string, format: uuid}
    UserEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: {data: {$ref: '#/components/schemas/User'}, meta: {$ref: '#/components/schemas/Meta'}}
    AuthTokenEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: {data: {$ref: '#/components/schemas/AuthToken'}, meta: {$ref: '#/components/schemas/Meta'}}
    Subtopic:
      type: object
      additionalProperties: false
      required: [id, code, title_fr, active]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        title_fr: {type: string}
        title_fa: {type: [string, 'null']}
        short_definition_fa: {type: [string, 'null']}
        active: {type: boolean}
    Lesson:
      type: object
      additionalProperties: false
      required: [id, lesson_no, title_fr, short_title, category_id, subcategory_id, active]
      properties:
        id: {type: string, format: uuid}
        lesson_no: {type: integer, minimum: 1, maximum: 52}
        title_fr: {type: string}
        short_title: {type: string}
        category_id: {type: string, format: uuid}
        subcategory_id: {type: string, format: uuid}
        tcf_weight: {type: number, minimum: 0}
        active: {type: boolean}
    LessonDetail:
      type: object
      additionalProperties: false
      required: [id, lesson_no, title_fr, short_title, category_id, subcategory_id, active, subtopics]
      properties:
        id: {type: string, format: uuid}
        lesson_no: {type: integer, minimum: 1, maximum: 52}
        title_fr: {type: string}
        short_title: {type: string}
        category_id: {type: string, format: uuid}
        subcategory_id: {type: string, format: uuid}
        tcf_weight: {type: number, minimum: 0}
        active: {type: boolean}
        subtopics: {type: array, items: {$ref: '#/components/schemas/Subtopic'}}
    LessonCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Lesson'}}
        page: {$ref: '#/components/schemas/Page'}
        meta: {$ref: '#/components/schemas/Meta'}
    LessonDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: {data: {$ref: '#/components/schemas/LessonDetail'}, meta: {$ref: '#/components/schemas/Meta'}}
    Difficulty: {type: string, enum: [EASY, MEDIUM, HARD, VERY_HARD]}
    QuestionStatus: {type: string, enum: [DRAFT, READY_FOR_REVIEW, CHANGES_REQUESTED, APPROVED, PUBLISHED, REJECTED, RETIRED]}
    TestCreateRequest:
      type: object
      additionalProperties: false
      required: [schema_version, mode, question_count, scope, difficulty_mix_pct]
      properties:
        schema_version: {type: string, enum: [test-config-schema-v0.9.0, adaptive-selection-config-v0.9.0]}
        mode: {type: string, enum: [custom, tcf, adaptive, review, mistakes]}
        question_count: {type: integer, minimum: 1, maximum: 100}
        scope: {type: object, minProperties: 1, additionalProperties: true}
        difficulty_mix_pct:
          type: object
          additionalProperties: false
          required: [EASY, MEDIUM, HARD, VERY_HARD]
          properties:
            EASY: {type: number, minimum: 0, maximum: 100}
            MEDIUM: {type: number, minimum: 0, maximum: 100}
            HARD: {type: number, minimum: 0, maximum: 100}
            VERY_HARD: {type: number, minimum: 0, maximum: 100}
        lesson_allocation: {type: object, additionalProperties: true}
        type_allocation: {type: object, additionalProperties: true}
        seed: {type: [string, 'null'], maxLength: 256}
    Test:
      type: object
      additionalProperties: false
      required: [id, mode, question_count, created_at]
      properties:
        id: {type: string, format: uuid}
        mode: {type: string}
        title: {type: [string, 'null']}
        question_count: {type: integer, minimum: 1}
        selection_model_version: {type: string}
        created_at: {type: string, format: date-time}
    TestEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: {data: {$ref: '#/components/schemas/Test'}, meta: {$ref: '#/components/schemas/Meta'}}
    Attempt:
      type: object
      additionalProperties: false
      required: [id, test_id, status, started_at]
      properties:
        id: {type: string, format: uuid}
        test_id: {type: string, format: uuid}
        status: {type: string, enum: [IN_PROGRESS, COMPLETED, ABANDONED]}
        started_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        score_raw: {type: [number, 'null']}
        score_pct: {type: [number, 'null'], minimum: 0, maximum: 100}
    AttemptEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: {data: {$ref: '#/components/schemas/Attempt'}, meta: {$ref: '#/components/schemas/Meta'}}
    AttemptOption:
      type: object
      additionalProperties: false
      required: [id, position, text]
      properties:
        id: {type: string, format: uuid}
        position: {type: string, enum: [A, B, C, D]}
        text: {type: string, maxLength: 500}
    AttemptQuestion:
      type: object
      additionalProperties: false
      description: Pre-answer allow-list; intentionally has no correct option or explanation fields.
      required: [test_question_id, question_revision_id, position, stem, stem_locale, question_type, difficulty, options]
      properties:
        test_question_id: {type: string, format: uuid}
        question_revision_id: {type: string, format: uuid}
        position: {type: integer, minimum: 1}
        stem: {type: string, maxLength: 2000}
        stem_locale: {type: string, enum: [fr-FR, fa-IR]}
        question_type: {type: string}
        difficulty: {$ref: '#/components/schemas/Difficulty'}
        options:
          type: array
          minItems: 4
          maxItems: 4
          items: {$ref: '#/components/schemas/AttemptOption'}
        media:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, uri]
            properties:
              type: {type: string, enum: [IMAGE, AUDIO, VIDEO]}
              uri: {type: string, format: uri-reference}
              alt_text: {type: [string, 'null']}
              transcript: {type: [string, 'null']}
    AttemptQuestionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: {data: {$ref: '#/components/schemas/AttemptQuestion'}, meta: {$ref: '#/components/schemas/Meta'}}
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [test_question_id, selected_option_id]
      properties:
        test_question_id: {type: string, format: uuid}
        selected_option_id: {type: string, format: uuid}
        response_ms: {type: [integer, 'null'], minimum: 0, maximum: 86400000}
    AnswerFeedback:
      type: object
      additionalProperties: false
      required: [is_correct, selected_option_id, correct_option_id]
      properties:
        is_correct: {type: boolean}
        selected_option_id: {type: string, format: uuid}
        correct_option_id: {type: string, format: uuid}
        selected_option_explanation: {type: [string, 'null']}
        correct_option_explanation: {type: [string, 'null']}
        full_explanation: {type: [string, 'null']}
    AnswerReceipt:
      type: object
      additionalProperties: false
      required: [answer_id, attempt_id, test_question_id, answered_at, feedback, mastery, review_schedule]
      properties:
        answer_id: {type: string, format: uuid}
        attempt_id: {type: string, format: uuid}
        test_question_id: {type: string, format: uuid}
        answered_at: {type: string, format: date-time}
        feedback: {$ref: '#/components/schemas/AnswerFeedback'}
        mastery: {$ref: '#/components/schemas/MasteryItem'}
        review_item_id: {type: [string, 'null'], format: uuid}
        review_schedule: {type: object, additionalProperties: true}
    AnswerReceiptEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: {data: {$ref: '#/components/schemas/AnswerReceipt'}, meta: {$ref: '#/components/schemas/Meta'}}
    AttemptResult:
      type: object
      additionalProperties: false
      required: [attempt_id, status, score_raw, score_pct, completed_at, breakdown]
      properties:
        attempt_id: {type: string, format: uuid}
        status: {const: COMPLETED}
        score_raw: {type: number}
        score_pct: {type: number, minimum: 0, maximum: 100}
        completed_at: {type: string, format: date-time}
        breakdown:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [test_question_id, position, answer_id, feedback]
            properties:
              test_question_id: {type: string, format: uuid}
              position: {type: integer, minimum: 1}
              answer_id: {type: string, format: uuid}
              feedback: {$ref: '#/components/schemas/AnswerFeedback'}
    AttemptResultEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: {data: {$ref: '#/components/schemas/AttemptResult'}, meta: {$ref: '#/components/schemas/Meta'}}
    ReviewSummary:
      type: object
      additionalProperties: false
      required: [id, kind, status, title, marked]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [MISTAKE, SPACED]}
        status: {type: string}
        title: {type: string, minLength: 1, maxLength: 2000}
        group_key: {type: [string, 'null']}
        repeat_count: {type: integer, minimum: 0}
        due_at: {type: [string, 'null'], format: date-time}
        marked: {type: boolean}
    ReviewCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ReviewSummary'}}
        page: {$ref: '#/components/schemas/Page'}
        meta: {$ref: '#/components/schemas/Meta'}
    ReviewItem:
      type: object
      additionalProperties: false
      required: [id, resolution_status, reviewability, marked, feedback_state, question]
      properties:
        id: {type: string, format: uuid}
        resolution_status: {type: string, enum: [UNRESOLVED, CORRECTED, EXCLUDED_CONTENT_ISSUE]}
        reviewability: {type: string, enum: [RETRY_ALLOWED, HISTORY_ONLY]}
        marked: {type: boolean}
        feedback_state: {type: string, enum: [HIDDEN, REVEALED]}
        previous_selected_option_id: {type: [string, 'null'], format: uuid}
        question: {$ref: '#/components/schemas/AttemptQuestion'}
    ReviewItemEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: {data: {$ref: '#/components/schemas/ReviewItem'}, meta: {$ref: '#/components/schemas/Meta'}}
    ReviewGradeRequest:
      type: object
      additionalProperties: false
      required: [selected_option_id]
      properties: {selected_option_id: {type: string, format: uuid}}
    ReviewMarkRequest:
      type: object
      additionalProperties: false
      required: [marked]
      properties: {marked: {type: boolean}}
    ReviewFeedbackEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [review_item, feedback]
          properties:
            review_item: {$ref: '#/components/schemas/ReviewItem'}
            feedback: {$ref: '#/components/schemas/AnswerFeedback'}
        meta: {$ref: '#/components/schemas/Meta'}
    MasteryItem:
      type: object
      additionalProperties: false
      required: [mastery_score_pct, confidence, coverage_ratio, mastery_band, model_version]
      properties:
        scope_type: {type: string, enum: [SUBTOPIC, LESSON, CATEGORY, TAG]}
        scope_id: {type: string, format: uuid}
        mastery_score_pct: {type: number, minimum: 0, maximum: 100}
        confidence: {type: number, minimum: 0, maximum: 1}
        coverage_ratio: {type: number, minimum: 0, maximum: 1}
        evidence_count: {type: integer, minimum: 0}
        mastery_band: {type: string, enum: [NO_EVIDENCE, UNCERTAIN, WEAK, DEVELOPING, STRONG]}
        model_version: {type: string}
    MasteryCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/MasteryItem'}}
        meta: {$ref: '#/components/schemas/Meta'}
    ProgressPoint:
      type: object
      additionalProperties: false
      required: [scope_type, scope_id, mastery_score_pct, confidence, coverage_ratio, evidence_count, mastery_band, model_version, captured_at]
      properties:
        scope_type: {type: string, enum: [SUBTOPIC, LESSON, CATEGORY, TAG]}
        scope_id: {type: string, format: uuid}
        mastery_score_pct: {type: number, minimum: 0, maximum: 100}
        confidence: {type: number, minimum: 0, maximum: 1}
        coverage_ratio: {type: number, minimum: 0, maximum: 1}
        evidence_count: {type: integer, minimum: 0}
        mastery_band: {type: string, enum: [NO_EVIDENCE, UNCERTAIN, WEAK, DEVELOPING, STRONG]}
        model_version: {type: string}
        captured_at: {type: string, format: date-time}
    ProgressEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [points, incomplete_data]
          properties:
            points:
              type: array
              items: {$ref: '#/components/schemas/ProgressPoint'}
            incomplete_data: {type: boolean}
            warning: {type: [string, 'null']}
        meta: {$ref: '#/components/schemas/Meta'}
    DashboardEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [as_of, next_action, mastery, review_queue, error_review, recent_test, trend, activity]
          properties:
            as_of: {type: string, format: date-time}
            next_action: {type: string, enum: [OVERDUE_REVIEW, DUE_REVIEW, CRITICAL_CONFIDENT_LESSON, WEAK_CONFIDENT_LESSON, DEVELOPING_LESSON, BUILD_EVIDENCE, REGULAR_PRACTICE]}
            mastery: {type: array, items: {$ref: '#/components/schemas/MasteryItem'}}
            review_queue: {type: object, additionalProperties: true}
            error_review: {type: object, additionalProperties: true}
            recent_test: {type: [object, 'null'], additionalProperties: true}
            trend: {type: object, additionalProperties: true}
            activity: {type: object, additionalProperties: true}
        meta: {$ref: '#/components/schemas/Meta'}
    NextActionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [code, destination, reason]
          properties:
            code: {type: string}
            destination: {type: string, pattern: '^/(en|fa)/'}
            reason: {type: string}
        meta: {$ref: '#/components/schemas/Meta'}
    AnalyticsJobRequest:
      type: object
      additionalProperties: false
      required: [job_type, input]
      properties:
        job_type: {type: string, enum: [DASHBOARD_REBUILD, MASTERY_BACKFILL, PROGRESS_REBUILD, QUESTION_METRICS_REBUILD]}
        input: {type: object, additionalProperties: true}
    AnalyticsJob:
      type: object
      additionalProperties: false
      required: [id, job_type, state, progress_pct, queued_at]
      properties:
        id: {type: string, format: uuid}
        job_type: {type: string}
        state: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]}
        progress_pct: {type: number, minimum: 0, maximum: 100}
